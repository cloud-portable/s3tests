[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-portable-s3tests"
version = "0.0.0"
description = "Runner for the language-independent S3 API compatibility test vectors"
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = [
  # request_checksum_calculation / response_checksum_validation need botocore >= 1.36.
  "boto3>=1.36",
  # The corpus. Not published yet: `make setup` installs it from the sibling
  # checkout (../../../s3vectors/packages/python) before this package.
  "cloud-portable-s3vectors",
]
keywords = ["s3", "compatibility", "conformance", "test-vectors", "boto3"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cloud-portable/s3tests"

[project.scripts]
s3tests = "cloud_portable_s3tests._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_portable_s3tests"]
